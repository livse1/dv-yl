<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>现代网站导航栏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
    }

    /* ========== 导航栏 ========== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }

    .navbar.scrolled {
      background: rgba(15, 23, 42, 0.95);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Logo */
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    /* 菜单 */
    .nav-menu {
      display: flex;
      align-items: center;
      gap: 8px;
      list-style: none;
    }

    .nav-item {
      position: relative;
    }

    .nav-link {
      display: block;
      padding: 10px 18px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 8px;
      transition: all 0.25s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    /* 下拉菜单 */
    .dropdown {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      min-width: 180px;
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 8px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .nav-item:hover .dropdown {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(4px);
    }

    .dropdown a {
      display: block;
      padding: 10px 14px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 0.9rem;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .dropdown a:hover {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    /* CTA 按钮 */
    .nav-cta {
      margin-left: 12px;
      padding: 10px 22px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 10px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    /* 汉堡按钮 */
    .hamburger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 8px;
      background: none;
      border: none;
    }

    .hamburger span {
      display: block;
      width: 24px;
      height: 2px;
      background: #e2e8f0;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .hamburger.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }
    .hamburger.active span:nth-child(2) {
      opacity: 0;
    }
    .hamburger.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    /* 移动端菜单 */
    .mobile-menu {
      display: none;
      position: fixed;
      top: 72px;
      left: 0;
      right: 0;
      background: #0f172a;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 16px 24px 24px;
      flex-direction: column;
      gap: 4px;
      transform: translateY(-20px);
      opacity: 0;
      transition: all 0.3s ease;
    }

    .mobile-menu.open {
      display: flex;
      transform: translateY(0);
      opacity: 1;
    }

    .mobile-menu a {
      display: block;
      padding: 14px 16px;
      color: #94a3b8;
      text-decoration: none;
      font-size: 1rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .mobile-menu a:hover,
    .mobile-menu a.active {
      color: #fff;
      background: rgba(255, 255, 255, 0.06);
    }

    .mobile-cta {
      margin-top: 12px;
      text-align: center;
      padding: 14px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff !important;
      font-weight: 600;
      border-radius: 10px;
    }

    /* 演示内容 */
    .hero {
      padding: 160px 24px 80px;
      text-align: center;
      max-width: 800px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero p {
      font-size: 1.15rem;
      color: #94a3b8;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    .hero-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      padding: 14px 32px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 30px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      padding: 14px 32px;
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      text-decoration: none;
      font-weight: 600;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.25s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .nav-menu {
        display: none;
      }

      .hamburger {
        display: flex;
      }

      .hero h1 {
        font-size: 2rem;
      }

      .hero {
        padding: 140px 20px 60px;
      }
    }
  </style>
</head>
<body>

  <!-- 导航栏 -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <!-- Logo -->
      <a href="#" class="logo">
        <div class="logo-icon">✦</div>
        <span>Nova</span>
      </a>

      <!-- 桌面端菜单 -->
      <ul class="nav-menu">
        <li class="nav-item">
          <a href="#" class="nav-link active">首页</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">产品</a>
          <div class="dropdown">
            <a href="#">产品概览</a>
            <a href="#">功能介绍</a>
            <a href="#">价格方案</a>
            <a href="#">更新日志</a>
            <a href="/vercel">DV越行</a>
          </div>
        </li>
        <li class="nav-item">
          <a href="https://github.com/ihfasn/dv-yx/tree/main" class="nav-link">解决方案</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link">关于我们</a>
        </li>
        <li class="nav-item">
          <a href="https://isn.us.ci" class="nav-link">博客</a>
        </li>
        <li>
          <a href="#" class="nav-cta">免费试用</a>
        </li>
      </ul>

      <!-- 汉堡按钮 -->
      <button class="hamburger" id="hamburger" aria-label="菜单">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- 移动端菜单 -->
  <div class="mobile-menu" id="mobileMenu">
    <a href="#" class="active">首页</a>
    <a href="#">产品</a>
    <a href="#">解决方案</a>
    <a href="#">关于我们</a>
    <a href="https://isn.us.ci">博客</a>
    <a href="#" class="mobile-cta">免费试用</a>
  </div>

  <!-- 演示内容 -->
  <section class="hero">
    <h1>现代网站导航栏<br>简洁 · 优雅 · 响应式</h1>
    <p>支持桌面端下拉菜单、移动端汉堡菜单、滚动阴影效果，纯 HTML + CSS + 少量 JS 实现，开箱即用。</p>
    <div class="hero-btns">
      <a href="#" class="btn-primary">立即体验</a>
      <a href="#" class="btn-secondary">查看文档</a>
    </div>
  </section>

  <script>
    // 汉堡菜单切换
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');

    hamburger.addEventListener('click', () => {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('open');
    });

    // 滚动时导航栏样式变化
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      if (window.scrollY > 20) {
        navbar.classList.add('scrolled');
      } else {
        navbar.classList.remove('scrolled');
      }
    });

    // 点击移动端菜单项后关闭菜单
    mobileMenu.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        hamburger.classList.remove('active');
        mobileMenu.classList.remove('open');
      });
    });
  </script>
</body>
</html>
